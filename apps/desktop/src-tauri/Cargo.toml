[package]
name = "desktop_app"
version = "0.1.4"
description = "A local-first database workspace for the desktop"
authors = ["u-ninja"]
license = "PolyForm-Shield-1.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-localhost = "2.4.0"
tauri-plugin-oauth = "2.1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql", "sqlite-bundled"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
futures-util = "0.3.34"
hex = "0.4"
sha2 = "=0.10.9"
keyring = "4.2.0"
# Runs the Docker CLI and OS package managers (local databases); already in the tree via Tauri
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "sync", "macros", "rt", "net"] }
# SQL Server: sqlx has no TDS driver. rustls like sqlx; sql-browser-tokio resolves named instances
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "rustls", "sql-browser-tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
# Microsoft Entra token requests (and Azure's managed identity endpoint); nothing in the tree speaks HTTPS
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
# The rest are already in the tree: SQL Server's XML plans, PKCE and the authorize URL
quick-xml = "0.42"
base64 = "0.22"
url = "2"
getrandom = "0.3"
tauri-plugin-window-state = "2"

# tiberius 0.13.0 plus the TDS federated-authentication (ADAL/MSAL) workflow, so an Entra sign-in
# can ask the server which tenant it trusts. See vendor/tiberius/QLUEPRINT_PATCH.md
# macOS: puts the traffic lights back where chrome.rs places them after AppKit resets them on a resize.
# Already in the tree through tao; the same versions
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[patch.crates-io]
tiberius = { path = "vendor/tiberius" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
