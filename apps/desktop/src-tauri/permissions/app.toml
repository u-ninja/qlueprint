# One set for every app command, so both capabilities (capabilities/default.json and the
# localhost one in src/lib.rs) grant the same list without repeating it.
[[set]]
identifier = "app-commands"
description = "Allows every QueryCraft command."
permissions = ["allow-disconnect", "allow-list-schemas", "allow-run-query",
  "allow-list-saved", "allow-connect-and-save", "allow-connect-saved", "allow-forget-saved"]
