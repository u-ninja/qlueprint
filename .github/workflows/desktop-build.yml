# Builds the desktop app for macOS (Apple Silicon), Windows and Linux.
# A v* tag publishes a GitHub release with every installer; a manual run only uploads them as artifacts.
name: Desktop build

on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: desktop-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      name: macos-arm64
                    - platform: windows-latest
                      name: windows-x64
                    # The oldest supported Ubuntu, so the .deb and AppImage run on older glibc too
                    - platform: ubuntu-22.04
                      name: linux-x64
        runs-on: ${{ matrix.platform }}
        defaults:
            run:
                working-directory: apps/desktop
        steps:
            - uses: actions/checkout@v7

            - name: Linux system libraries
              if: runner.os == 'Linux'
              # Avoid the runner's Azure mirror, which can fail DNS resolution; retry downloads and fail fast.
              timeout-minutes: 15
              run: |
                  sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
                  sudo apt-get -o Acquire::Retries=5 update
                  sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - uses: pnpm/action-setup@v6
              with:
                  version: 12.4.2
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: apps/desktop/pnpm-lock.yaml
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri -> target

            - run: pnpm install --frozen-lockfile

            - uses: tauri-apps/tauri-action@v0
              id: tauri
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: apps/desktop
                  # Only a tag publishes; a manual run leaves the release fields empty and just builds
                  tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
                  releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('QluePrint {0}', github.ref_name) || '' }}
                  releaseBody: |
                      Installers for macOS (Apple Silicon), Windows and Linux.

                      macOS: the app is not notarized yet. On first launch, open System Settings → Privacy & Security and click **Open Anyway** (macOS 15+), or right-click the app and choose **Open**.
                      Windows: SmartScreen may warn about an unknown publisher; click **More info → Run anyway**.
                  releaseDraft: false

            - name: Keep the installers (manual runs)
              if: ${{ !startsWith(github.ref, 'refs/tags/') }}
              uses: actions/upload-artifact@v7
              with:
                  name: qlueprint-${{ matrix.name }}
                  path: |
                      apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
                      apps/desktop/src-tauri/target/release/bundle/msi/*.msi
                      apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
                      apps/desktop/src-tauri/target/release/bundle/deb/*.deb
                      apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
                      apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
                  if-no-files-found: error
